<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5f6f9" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/app-icon.svg" sizes="any" type="image/svg+xml" />
    <meta
      name="description"
      content="Bolsillo — gestiona tus gastos, ingresos, billeteras y pagos fijos en un solo lugar."
    />
    <title>Bolsillo — Gestor de gastos</title>
    <script>
      try {
        const raw = localStorage.getItem('bolsillo.v1')
        const stored = raw ? JSON.parse(raw) : null
        const theme = stored?.state?.settings?.theme ?? 'system'
        const dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
