<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Bolsillo — gestiona tus gastos, ingresos, billeteras y pagos fijos en un solo lugar."
    />
    <title>Bolsillo — Gestor de gastos</title>
    <script>
      try {
        const raw = localStorage.getItem('bolsillo.v1')
        const stored = raw ? JSON.parse(raw) : null
        const theme = stored?.state?.settings?.theme ?? 'system'
        const dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
